name: scrape-jobs   # 채용공고 — 수동 + 스크래퍼 코드 변경 시

on:
  workflow_dispatch: {}    # 수동 실행 — 정기 수집은 외부 핑거→run-all이 담당(cron 중복 제거)
  # ⚠️ 수동 전용이 아니다. 아래 push 트리거로 **코드 푸시마다 채용 수집이 한 번 더 돈다**
  #    (스크래퍼를 고치면 바로 반영해 보려는 의도). 그래서 이 워크플로도 status.json을 쓰며,
  #    export 전 origin 동기화 스텝이 없으면 run-all이 방금 쓴 news·industry 시각을 되돌린다(실측 사고).
  push:
    branches: [main, master]
    paths: ["src/**", "config.yaml", ".github/workflows/scrape.yml"]

permissions:
  contents: write
concurrency:
  group: data-commit          # 세 워크플로 공유 → push 직렬화(충돌 방지)
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul   # 금일·마감일을 한국 시간 기준으로
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"   # Node20 deprecation 경고 제거(액션 Node24 강제)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      # 다른 워크플로가 먼저 올린 status.json을 받아온 뒤 내 몫만 갱신한다.
      # (이 단계가 없으면 옛 체크아웃의 status.json으로 남의 스트림 시각까지 되돌린다 — 실측 사고)
      - run: git pull --rebase --autostash origin "${{ github.ref_name }}" || true
      - run: python -m src.export --part jobs
      - name: Commit jobs.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/jobs.json docs/data/status.json state.json docs/sitemap.xml
          if git diff --staged --quiet; then echo "변경 없음"; else
            git commit -m "auto: 채용 갱신"
            git pull --rebase --autostash -X theirs origin "${{ github.ref_name }}"
            git push
          fi
